; PlatformIO Project Configuration
;
; Tavern Scribe Live — ESP32 table-effects firmware
; Subscribes to a campaign's real-time room and fires relays/LEDs on
; table moments (natural 20s, natural 1s) with zero polling delay.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    ; WiFi management with captive portal
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ; WebSocket client (SignalR rides plain websockets)
    https://github.com/Links2004/arduinoWebSockets.git
    ; JSON parsing for SignalR frames
    bblanchon/ArduinoJson@^7.0.0

upload_speed = 921600
board_build.partitions = default.csv
